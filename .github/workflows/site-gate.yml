# 발행 관문 — 모든 push·PR 에서 site_gate(수치·금지어·정합·외부 로드·비밀값)와 JS 문법을 검사한다.
# 실패하면 커밋에 빨간 X 가 붙고 메일로 알림이 온다. 로컬에서는 같은 명령을 그대로 돌리면 된다:
#   python pipeline/gate/site_gate.py && python pipeline/gate/check_js.py
name: site-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 관문은 data_v4 최상위 json 만 읽는다 — 지오메트리 폴더(수백 MB)는 받지 않는다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data_v4/clusters/
            !/data_v4/top10/
            !/data_v4/units/
            !/data_v4/pnu/
            !/data_v4/parcels/
            !/data_v4/existing_parcels/
            !/data_v4/advisory/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: site_gate
        run: python pipeline/gate/site_gate.py

      - name: JS 문법
        run: python pipeline/gate/check_js.py
